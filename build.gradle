plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    smoke {
        resources.srcDir '.cache/scanner-fixtures'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neo_version
    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'file.encoding', 'UTF-8'
            logLevel = org.slf4j.event.Level.INFO
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    implementation 'curse.maven:prefab-246550:8371870'
    implementation 'curse.maven:goety-586095:8911352'
    runtimeOnly 'curse.maven:curios-309927:6529130'
    runtimeOnly 'curse.maven:patchouli-306770:7730942'
    runtimeOnly 'curse.maven:goety-delight-1363736:8712116'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: mod_version }
    exclude '**/.gitkeep'
    exclude '**/.cache/**'
}

jar {
    from('LICENSE')
    manifest.attributes('Implementation-Title': mod_id, 'Implementation-Version': mod_version)
}
